name: Build executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            executable: Typewriter.exe
          # The current WebView binding requires WebKitGTK 4.0 (not 4.1).
          - os: ubuntu-22.04
            platform: linux
            executable: Typewriter
    env:
      CGO_ENABLED: '1'
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache-dependency-path: launcher/go.sum

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Add Windows compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Join-Path $env:MSYS2_LOCATION 'ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev xdg-utils

      - name: Test application
        run: bun test

      - name: Test launcher and build executable
        run: bun run build --check

      - name: Verify packaged executable
        run: bun run verify-desktop.ts ./${{ matrix.executable }}

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item Typewriter.exe, README.md -Destination dist/package
          Compress-Archive -Path dist/package/* -DestinationPath dist/Typewriter-windows-x64.zip
          $archiveHash = (Get-FileHash dist/Typewriter-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  Typewriter-windows-x64.zip" | Set-Content dist/Typewriter-windows-x64.zip.sha256 -Encoding ascii

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/Typewriter-linux-x64.tar.gz Typewriter README.md
          cd dist
          sha256sum Typewriter-linux-x64.tar.gz > Typewriter-linux-x64.tar.gz.sha256

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: Typewriter-${{ matrix.platform }}-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Typewriter-*-x64
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check Typewriter-windows-x64.zip.sha256
          sha256sum --check Typewriter-linux-x64.tar.gz.sha256
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if [ "$(jq -r '.isDraft' release.json)" != 'true' ]; then
              echo 'A release já está publicada. Crie uma nova tag para outra versão.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Typewriter $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" Typewriter-windows-x64.zip Typewriter-linux-x64.tar.gz ./*.sha256 --clobber
